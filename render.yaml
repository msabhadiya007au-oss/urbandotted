# Render Blueprint for Urban Dotted Expense Book
# https://render.com/docs/blueprint-spec
#
# One backend Web Service + one Static Site frontend.
# The Static Site proxies /api/* to the backend so cookies stay first-party.

services:
  # ------------------------------------------------------------------- backend
  - type: web
    name: urbandotted-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: urbandotted
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Cross-origin cookie policy — set to the frontend's public origin.
      - key: CORS_ORIGINS
        value: https://urbandotted.onrender.com
      # Cookie flags. With the Static Site rewrite in place the browser sees
      # API calls as same-origin, so Lax is safe and Secure stays on.
      - key: COOKIE_SAMESITE
        value: lax
      - key: COOKIE_SECURE
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "600"
      # Google OAuth is OFF by default. To enable, set true + provide a
      # session-data exchange URL you control.
      - key: GOOGLE_OAUTH_ENABLED
        value: "false"
      - key: GOOGLE_SESSION_URL
        sync: false
      # Object storage (receipts / documents). Local disk by default.
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_DIR
        value: /var/data/receipts
      # Payroll bank-detail encryption key. Generate once with openssl rand -hex 48.
      - key: PAYROLL_ENC_KEY
        generateValue: true
      # Optional S3 storage. Uncomment and provide credentials to enable.
      # - key: S3_BUCKET
      #   sync: false
      # - key: S3_REGION
      #   value: ap-southeast-2
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      # - key: S3_ENDPOINT_URL
      #   sync: false
    disk:
      name: receipts
      mountPath: /var/data
      sizeGB: 1

  # ------------------------------------------------------------------ frontend
  - type: web
    name: urbandotted-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    autoDeploy: true
    # Rewrites: /api/* goes to the backend (browser sees same origin so cookies
    # stay first-party). /* falls back to index.html so React Router works.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://urbandotted-api.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    # Cache headers: revalidate index.html, freeze hashed bundles.
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Empty / unset in production => same-origin API calls (recommended).
      - key: REACT_APP_BACKEND_URL
        value: ""
      - key: CI
        value: "false"
